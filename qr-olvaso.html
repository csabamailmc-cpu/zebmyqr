<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR olvasó</title>
<!--
  ===================================================================
  QR OLVASO -- egyetlen HTML fajl, iPhone Safari / Firefox
  ===================================================================

  MUKODES
    A kamera kepet folyamatosan vizsgalja. Ha sikerul dekodolni:
      - megszolal egy 440 Hz-es hang (alapbeallitas: 3,5 masodperc)
      - a keszulek rezeg egyet
      - a kod tartalma megjelenik egy szovegdobozban
    Az OK gomb megnyomasa a hangot azonnal elhallgattatja, a doboz
    eltunik, es a kereses folytatodik.
    A hang frekvenciaja, hossza es hangereje a szkript elejen allithato
    (BEEP_HZ, BEEP_SEC, BEEP_VOL).

  FONTOS -- HTTPS KELL, MINDEN BONGESZOBEN!
    A getUserMedia (kamera) a webszabvany szerint csak "biztonsagos
    kornyezetben" mukodik: https:// vagy http://localhost. Ez NEM
    Safari-sajatossag -- a Chrome, a Firefox es az Edge is igy mukodik,
    minden platformon. iPhone-on a Firefox es a Chrome ugyanugy HTTPS-t
    kovetel, mint a Safari.
    Egy "file://" utvonalon megnyitott HTML NEM kap kamerat.
    Megoldasok:
      - tedd fel barmilyen HTTPS-es tarhelyre (GitHub Pages, Netlify)
      - vagy a gepeden:  python3 -m http.server 8000
        majd egy HTTPS-alagut (pl. localhost.run, ngrok)
      - vagy asztali gepen localhost-on nyisd meg (ott http is jo)

  MELYIK DEKODOLOT HASZNALJA ES MIERT
    A merések (117 kodos A4 lapok, tobbfele torzitas, 4 felismero)
    ezt a sorrendet adtak:
      1. WeChat CNN     85-90%   -- bongeszoben nem elerheto
      2. ZXing (C++)    76-83%   -- ITT: zxing-wasm, UGYANAZ a motor
      3. ZBar           75-78%   -- bongeszoben nem elerheto
      4. OpenCV ArUco   67-71%   -- nem relevans telefonon
    Ezert a fajl NEGY utat probal, ebben a sorrendben:
      A) zxing-wasm -- a zxing-cpp WebAssemblyre forditva. PONTOSAN az
         a motor, amivel a mereseimet vegeztem, es majdnem natív
         sebesseggel fut. Ez a fo dekodolo.
      B) natív BarcodeDetector -- FIGYELEM: a Safari, es igy MINDEN
         iOS-es bongeszo (mert azok is WebKit-re epulnek) NEM tamogatja.
         iPhone-on ez az ag sosem fut le. Androidos Chrome-ban igen.
      C) ZXing-js -- tiszta JavaScript ZXing, tartalek.
      D) jsQR     -- mas algoritmus, vegso tartalek.
    Ha az egyik nem talal, a masik meg talalhat.

  ELOFELDOLGOZAS
    A meresek szerint a szuk quiet zone-os kodoknal sokat segit, ha a
    kepet tobb meretben es kontraszttal is megprobaljuk. A fajl minden
    kepkockan negy valtozatot probal: eredeti, kontrasztnovelt,
    kicsinyitett, es kozepre vagott (nagyitott).

  ONHORDO VALTOZAT
    Ez a mappa mindent tartalmaz, ami a mukodeshez kell -- nincs
    internetkapcsolat-igeny a konyvtarakhoz:
      qr-olvaso.html            ez a fajl
      robots.txt                a keresok kizarasa
      lib/jsQR.js               jsQR dekodolo
      lib/zxing-library.min.js  ZXing JavaScript valtozat
      lib/zxing-wasm-reader.js  zxing-cpp WebAssembly betolto
      lib/zxing_reader.wasm     a WebAssembly binaris (1,1 MB)
    A teljes mappat kell feltolteni, a szerkezet megtartasaval.
  ===================================================================
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111; color: #eee; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  video { width: 100%; height: 100%; object-fit: cover; background: #000; }
  #frame {
    position: absolute; inset: 0; margin: auto;
    width: min(70vw, 70vh); height: min(70vw, 70vh);
    border: 3px solid rgba(255,255,255,.75); border-radius: 12px;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); pointer-events: none;
  }
  #frame.hit { border-color: #35d07f; }
  .topbtn {
    position: absolute; right: 10px; z-index: 5;
    top: calc(44px + env(safe-area-inset-top));
    width: auto; min-height: 48px; padding: 10px 16px; font-size: 15px;
    background: #3a3a3c;
  }
  .topbtn[aria-pressed="true"] { background: #0a6fd8; }
  #bar {
    position: absolute; left: 0; right: 0; top: 0; padding: 10px 14px;
    background: rgba(0,0,0,.55); font-size: 14px; display: flex;
    justify-content: space-between; gap: 10px;
  }
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #1c1c1e; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    border-top: 1px solid #333; display: none;
  }
  #panel.show { display: block; }
  #out {
    width: 100%; min-height: 92px; font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 10px; border-radius: 10px; border: 1px solid #444;
    background: #000; color: #eee; resize: vertical;
  }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  button {
    /* min-height 48px: WCAG 2.5.8 (Target Size, Minimum) 24x24 CSS px-et
       ker, a 2.5.5 (Enhanced) 44x44-et -- ez mindkettonek megfelel */
    flex: 1; min-height: 48px; padding: 14px; font-size: 17px; font-weight: 600;
    border: 0; border-radius: 10px; color: #fff;
    /* #0a84ff feher szoveggel csak 3,65:1 -> WCAG 1.4.3 BUKIK, mert a
       17px felkover nem szamit "nagy szovegnek" (ahhoz 18,66px kell).
       A #0a6fd8 mar 4,91:1. */
    background: #0a6fd8;
  }
  button.sec { background: #3a3a3c; }   /* 11,35:1 */
  /* WCAG 2.4.7 (Focus Visible) + 2.4.13 (Focus Appearance) */
  a:focus-visible, button:focus-visible, textarea:focus-visible {
    outline: 3px solid #ffd60a; outline-offset: 2px;
  }
  /* WCAG 1.4.11: a nem-szoveges elemek kontrasztja >= 3:1 */
  #frame { border-color: rgba(255,255,255,.85); }
  #frame.hit { border-color: #35d07f; }   /* 9,42:1 a hatteren */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  #meta { font-size: 13px; color: #9a9a9e; margin-top: 8px; }
  #err, #stopped {
    position: absolute; inset: 0; display: none; place-items: center;
    padding: 24px; text-align: center; background: #111;
  }
  #err.show, #stopped.show { display: grid; }
  #stopped button { max-width: 320px; margin-top: 18px; }
  a { color: #0a84ff; }
</style>
</head>
<body>
<div id="wrap">
  <h1 class="sr-only">QR-kód olvasó</h1>

  <!-- A videokep dekorativ a kepernyoolvaso szamara: a tartalmat nem
       tudja felolvasni, es a hasznos informaciot (a dekodolt szoveget)
       a lenti panel adja. Ezert aria-hidden. -->
  <video id="v" playsinline muted autoplay aria-hidden="true"></video>
  <div id="frame" aria-hidden="true"></div>

  <!-- Kimelo mod: ritkabb vizsgalat, hogy a kepernyoolvaso zavartalanul
       beszelhessen. A gomb a lap tetejen van, hogy Tab-bal elsokent
       elerheto legyen. -->
  <button id="gentle" type="button" class="topbtn" aria-pressed="false">
    Kímélő mód<span class="sr-only"> képernyőolvasóhoz: ritkább vizsgálat, zavartalan felolvasás</span>
  </button>

  <div id="bar">
    <!-- A sebessegkijelzo TISZTAN VIZUALIS. Korabban role="status" volt
         rajta, es masodpercenkent valtozott a szovege es az aria-label-je
         -- ez a VoiceOver beszedét folyamatosan felbeszakitotta, es a lap
         hasznalhatatlanna valt. Egy masodpercenkent valtozo szam SOHA nem
         lehet elo regio. Most aria-hidden, tehat a kepernyoolvaso at is
         ugorja. Az allapotot a #announce mondja be, ritkan es ertelmesen. -->
    <span id="status" aria-hidden="true">Indulás…</span>
    <span id="engine" aria-hidden="true"></span>
  </div>

  <!-- Ez a regio mondja be az allapotot. POLITE, nem assertive: az
       assertive megszakitja a folyamatban levo felolvasast, ami zavaro.
       Csak ritkan, ertelmes esemenyeknel irunk bele. -->
  <p id="announce" role="status" aria-live="polite" class="sr-only"></p>

  <!-- role="dialog": a talalat egy parbeszedpanel. aria-modal="false",
       mert a kamerakep alatta tovabbra is lathato marad. -->
  <div id="panel" role="dialog" aria-modal="false"
       aria-labelledby="panel-cim" aria-describedby="meta">
    <h2 id="panel-cim" class="sr-only">A beolvasott kód tartalma</h2>
    <!-- MIERT textarea es nem <output> vagy <p>?
         Mert igy a szoveg kijelolheto es masolhato -- ez a fo cel.
         FONTOS: "readonly", NEM "disabled": a disabled elemet a
         kepernyoolvaso kihagyja es nem is fokuszalhato. A readonly
         viszont fokuszalhato, felolvashato es masolhato.
         A tartalom valtozasat a #announce elo regio mondja be, mert a
         textarea ertekvaltozasat a kepernyoolvasok nem jelzik maguktol. -->
    <label for="out" class="sr-only">A beolvasott kód szövege</label>
    <textarea id="out" rows="3" readonly spellcheck="false"
      autocapitalize="off" autocorrect="off"
      aria-describedby="meta"></textarea>
    <p id="meta"></p>
    <div class="row">
      <button id="copy" class="sec" type="button">
        Másolás<span class="sr-only"> a vágólapra</span>
      </button>
      <!-- WCAG 1.4.2 (Audio Control): a 3,5 masodperces hang tobb mint
           3 masodpercig szol, ezert KELL egy elerheto leallito vezerlo.
           Ez az OK gomb, es a felirata ki is mondja. -->
      <button id="go" type="button">
        Felismerés folytatása<span class="sr-only">, a hang leállítása</span>
      </button>
    </div>
    <div class="row">
      <button id="stop" class="sec" type="button">
        Felismerés megszakítása, bezárás<span class="sr-only">, a kamera kikapcsolása</span>
      </button>
    </div>
  </div>

  <div id="stopped" role="dialog" aria-modal="false" aria-labelledby="stop-cim">
    <div>
      <h2 id="stop-cim">A felismerés leállítva</h2>
      <p>A kamera ki van kapcsolva. Az újraindításhoz nyomd meg az alábbi gombot.</p>
      <button id="restart" type="button">Felismerés indítása</button>
    </div>
  </div>

  <div id="err" role="alert">
    <div>
      <h2>Nincs kamerakép</h2>
      <p id="errmsg"></p>
      <p style="font-size:14px;color:#9a9a9e">
        Az iPhone csak <b>https://</b> címen ad kamera-hozzáférést.
        Ha a fájlt <code>file://</code> útvonalról nyitottad meg,
        tedd fel egy HTTPS-es tárhelyre.
      </p>
    </div>
  </div>
</div>

<script src="lib/jsQR.js"></script>
<script src="lib/zxing-library.min.js"></script>
<script src="lib/zxing-wasm-reader.js"></script>
<script>
  /* zxing-wasm (zxing-cpp WebAssembly) -- HELYI fajlbol.
     Az IIFE valtozat a ZXingWASM globalis objektumot adja, tehat nem
     kell ES-modul. A .wasm binarist kifejezetten a lib/ mappabol
     toltjuk be, kulonben a csomag a jsdelivr CDN-t keresne. */
  (function () {
    if (!window.ZXingWASM) { window.__zxingWasm = null; return; }
    try {
      window.ZXingWASM.prepareZXingModule({
        overrides: {
          locateFile: function (path, prefix) {
            return path.endsWith('.wasm') ? 'lib/' + path : prefix + path;
          }
        },
        fireImmediately: true
      });
      window.__zxingWasm = window.ZXingWASM;
    } catch (e) { window.__zxingWasm = null; }
  })();
</script>
<script>
(function () {
  "use strict";

  /* ===================================================================
     HANGJELZES A SIKERES FELISMERESKOR
     -------------------------------------------------------------------
     BEEP_HZ    a hang frekvenciaja Hz-ben (440 = normal A hang)
     BEEP_SEC   a hang hossza masodpercben
     BEEP_VOL   hangero 0.0 es 1.0 kozott

     A hang mindenkeppen elhallgat, amint megnyomod az OK gombot.

     FONTOS -- iOS KORLATOZAS:
     A Safari (es minden iOS-es bongeszo) CSAK felhasznaloi erintes utan
     enged hangot lejatszani. Ezert a lap az elso erintesre "feloldja" a
     hangkimenetet. Ha a legelso beolvasas nema, koppints egyet a
     kepernyore, es onnantol szolni fog.
     =================================================================== */
  var BEEP_HZ  = 440;
  var BEEP_SEC = 3.5;
  var BEEP_VOL = 0.25;

  /* ===================================================================
     UJRA-FELISMERES ELLENI VEDELEM
     -------------------------------------------------------------------
     Ha az OK utan ugyanaz a kod meg a kamera elott van, a program
     azonnal ujra felismerne -- vegtelen korbe kerulne. Ezert:
       COOLDOWN_MS    az OK utan ennyi ideig egyaltalan nem keresunk
       SAME_IGNORE_MS eddig figyelmen kivul hagyjuk UGYANAZT a szoveget
                      (mas kod persze azonnal felismerheto)
     Allitsd SAME_IGNORE_MS = 0 -ra, ha ugyanazt a kodot tobbszor
     egymas utan is be akarod olvasni.
     =================================================================== */
  var COOLDOWN_MS    = 700;
  var SAME_IGNORE_MS = 4000;

  /* ===================================================================
     SZUNET KET VIZSGALAT KOZOTT -- EZ A LEGFONTOSABB BEALLITAS
     -------------------------------------------------------------------
     A dekodolas SZINKRON es lassu (merve: 58 ms tiszta kepen, akar
     1000 ms mintas hatteren). Ha megallas nelkul, requestAnimationFrame-
     mel futtatjuk, a fo szal 100%-ban foglalt marad, es a kepernyoolvaso
     (VoiceOver, TalkBack) beszede ELNEMUL, mert nem jut idohoz.
     Ezert ket vizsgalat kozott KOTELEZO szunetet tartani.

     SCAN_GAP_MS      alap szunet ket vizsgalat kozott
     SCAN_GAP_A11Y_MS szunet, ha kepernyoolvaso hasznalatat gyanitjuk
                      vagy a felhasznalo bekapcsolja a "kimelo mod"-ot
     A kimelo mod lassabb felismerest ad, cserebe a keszulek reagal.
     =================================================================== */
  var SCAN_GAP_MS      = 120;
  var SCAN_GAP_A11Y_MS = 400;
  var gentle = false;              // kimelo mod

  var cooldownUntil = 0;
  var lastHitText   = null;
  var lastHitTime   = 0;

  var actx = null, beepOsc = null, beepGain = null;

  function audioUnlock() {
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      actx = new AC();
      /* nema, nagyon rovid hang: ez oldja fel az iOS hangkimenetet */
      var o = actx.createOscillator(), g = actx.createGain();
      g.gain.value = 0.0001;
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.01);
    } catch (e) { actx = null; }
  }

  function beepStop() {
    if (!beepOsc) return;
    try {
      var t = actx.currentTime;
      beepGain.gain.cancelScheduledValues(t);
      beepGain.gain.setValueAtTime(beepGain.gain.value, t);
      beepGain.gain.linearRampToValueAtTime(0.0001, t + 0.03);
      beepOsc.stop(t + 0.04);
    } catch (e) {}
    beepOsc = null; beepGain = null;
  }

  function beepStart() {
    if (!actx) return;
    if (actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
    beepStop();
    try {
      var t = actx.currentTime;
      beepOsc  = actx.createOscillator();
      beepGain = actx.createGain();
      beepOsc.type = 'sine';
      beepOsc.frequency.setValueAtTime(BEEP_HZ, t);
      /* lagy be- es kihangositas, hogy ne pattanjon a hangszoro */
      beepGain.gain.setValueAtTime(0.0001, t);
      beepGain.gain.exponentialRampToValueAtTime(BEEP_VOL, t + 0.02);
      beepGain.gain.setValueAtTime(BEEP_VOL, t + BEEP_SEC - 0.05);
      beepGain.gain.exponentialRampToValueAtTime(0.0001, t + BEEP_SEC);
      beepOsc.connect(beepGain); beepGain.connect(actx.destination);
      beepOsc.start(t);
      beepOsc.stop(t + BEEP_SEC + 0.02);
      beepOsc.onended = function () { beepOsc = null; beepGain = null; };
    } catch (e) { beepOsc = null; beepGain = null; }
  }

  /* az elso erintes/kattintas feloldja a hangot (iOS kovetelmeny) */
  ['touchstart', 'click'].forEach(function (ev) {
    document.addEventListener(ev, audioUnlock, { once: false, passive: true });
  });

  var video   = document.getElementById('v');
  var panel   = document.getElementById('panel');
  var out     = document.getElementById('out');
  var meta    = document.getElementById('meta');
  var status  = document.getElementById('status');
  var announce= document.getElementById('announce');
  var goBtn      = document.getElementById('go');
  var stopBtn    = document.getElementById('stop');
  var restartBtn = document.getElementById('restart');
  var stoppedBox = document.getElementById('stopped');
  var camStream  = null;    // a kamera folyama, hogy le tudjuk allitani
  var running    = false;   // fut-e a kereses ciklusa
  var engineEl= document.getElementById('engine');
  var frame   = document.getElementById('frame');
  var errBox  = document.getElementById('err');
  var errMsg  = document.getElementById('errmsg');

  var paused  = false;       // amig a talalat lathato, nem keresunk
  var lastText = null;
  var scans = 0, hits = 0;
  var fpsT0 = 0, fpsN = 0, fps = 0;   // valodi keresesi sebesseg

  // --- vaszon a kepkockak feldolgozasahoz ---
  var cv = document.createElement('canvas');
  /* A getContext NULL-t is visszaadhat (memoriahiany, tul sok vaszon,
     egyes bongeszok korlatozasai). Enelkul a lap az elso kepkockan
     osszeomlana. A masodik hivas a 'willReadFrequently' nelkul azert
     van, mert azt a regebbi Safari nem ismeri -- ilyenkor is mukodik,
     csak lassabban. */
  var cx = null;
  try { cx = cv.getContext('2d', { willReadFrequently: true }); } catch (e) { cx = null; }
  if (!cx) { try { cx = cv.getContext('2d'); } catch (e) { cx = null; } }

  // --- A) natív BarcodeDetector ---
  var native = null;
  if ('BarcodeDetector' in window) {
    try { native = new window.BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { native = null; }
  }

  // --- B) ZXing ---
  var zxing = null;
  try {
    if (window.ZXing && window.ZXing.MultiFormatReader) {
      var hints = new Map();
      hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, [window.ZXing.BarcodeFormat.QR_CODE]);
      // TRY_HARDER: lassabb, de a szuk quiet zone-os kodoknal sokat segit
      hints.set(window.ZXing.DecodeHintType.TRY_HARDER, true);
      zxing = new window.ZXing.MultiFormatReader();
      zxing.setHints(hints);
    }
  } catch (e) { zxing = null; }

  function zxingDecode(imgData) {
    if (!zxing) return null;
    try {
      var lum = new window.ZXing.RGBLuminanceSource(
        new Uint8ClampedArray(imgData.data.buffer.slice(0)),
        imgData.width, imgData.height);
      var bmp = new window.ZXing.BinaryBitmap(new window.ZXing.HybridBinarizer(lum));
      var r = zxing.decode(bmp);
      return r ? r.getText() : null;
    } catch (e) { return null; }
    finally { try { zxing.reset(); } catch (e) {} }
  }

  // --- A) zxing-wasm (a mereseim legjobb bongeszos dekodoloja) ---
  var wasmBusy = false;
  function wasmDecode(imgData) {
    var m = window.__zxingWasm;
    if (!m || wasmBusy || paused) return;
    wasmBusy = true;
    m.readBarcodes(imgData, { formats: ['QRCode'], tryHarder: true, maxNumberOfSymbols: 1 })
      .then(function (res) {
        if (res && res.length && accept(res[0].text)) { hits++; show(res[0].text, 'zxing-wasm'); }
      })
      .catch(function () {})
      .then(function () { wasmBusy = false; });
  }

  // --- C) jsQR ---
  function jsqrDecode(imgData) {
    if (!window.jsQR) return null;
    /* 'dontInvert': a mi kodjaink mindig sotet-vilagos allasuak.
       Az 'attemptBoth' zajos kepen MEGDUPLAZZA a koltseget
       (merve: 952 ms helyett 2032 ms egy 480x480-as zajos kepen). */
    var r = window.jsQR(imgData.data, imgData.width, imgData.height,
                        { inversionAttempts: 'dontInvert' });
    return r ? r.data : null;
  }

  // --- elofeldolgozas: kontraszt novelese ---
  function boost(src) {
    /* Az "new ImageData(...)" konstruktor csak Safari 12.1+ ota letezik.
       A cx.createImageData() viszont a Canvas 2D legelso verzioja ota
       megvan, minden bongeszoben. Ezert azt hasznaljuk, es csak akkor
       esunk vissza a konstruktorra, ha nincs vaszon. */
    var d;
    if (cx && cx.createImageData) {
      d = cx.createImageData(src.width, src.height);
      d.data.set(src.data);
    } else if (typeof ImageData === 'function') {
      d = new ImageData(new Uint8ClampedArray(src.data), src.width, src.height);
    } else {
      return src;                 // nincs mod masolatot keszitani
    }
    var p = d.data, i, y;
    for (i = 0; i < p.length; i += 4) {
      y = (p[i] * 0.299 + p[i+1] * 0.587 + p[i+2] * 0.114);
      y = y < 110 ? 0 : (y > 145 ? 255 : (y - 110) * (255 / 35));
      p[i] = p[i+1] = p[i+2] = y;
    }
    return d;
  }

  /* ===================================================================
     TELJESITMENY -- MIERT EGY VALTOZAT KEPKOCKANKENT?
     -------------------------------------------------------------------
     Meres (Node, 480x480-as kep, jsQR):
        sima/ures kep     58 ms
        QR-szeru minta    78 ms
        zajos kep       2032 ms   <-- ez a veszelyes eset
     Ha kepkockankent mind a 4 kepvaltozatot vegigprobalnank ket
     szinkron dekodoloval, az 8 hivas = akar 0,5 mp is lehetne egy
     kepkockara. Ezert kepkockankent CSAK EGY valtozatot probalunk,
     korbeforgatva. Igy negy kepkocka alatt mindegyik sorra kerul,
     de egyik sem blokkolja a felhasznaloi feluletet.
     A zxing-wasm ettol fuggetlenul, aszinkron modon fut minden
     kepkockan -- az a fo dekodolo, ezek csak tartalekok.
     =================================================================== */
  var variantIdx = 0;
  function tryDecode(full, center) {
    var list = [
      ['közép',            center],
      ['teljes',           full],
      ['közép+kontraszt',  null],   // lustan keszul, lasd lentebb
      ['teljes+kontraszt', null]
    ];
    var k = variantIdx % list.length;
    variantIdx++;
    var name = list[k][0], img = list[k][1];
    if (img === null) img = boost(k === 2 ? center : full);
    if (!img) return null;
    var t;
    t = zxingDecode(img);  if (t) return { text: t, how: 'ZXing-js / ' + name };
    t = jsqrDecode(img);   if (t) return { text: t, how: 'jsQR / ' + name };
    return null;
  }

  function grab() {
    if (!cx) return null;                 // nincs hasznalhato vaszon
    var w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return null;
    /* teljes kep, legfeljebb 480 px szeles. A merés szerint a
       dekodolas koltsege a kepterulettel no, es 480 px-en a 15 mm-es
       QR meg boven eleg reszletes. */
    var s = Math.min(1, 480 / w);
    cv.width = Math.round(w * s); cv.height = Math.round(h * s);
    cx.drawImage(video, 0, 0, cv.width, cv.height);
    var full = cx.getImageData(0, 0, cv.width, cv.height);
    // kozepso negyzet kinagyitva: a kereten belul levo kodhoz
    var side = Math.round(Math.min(w, h) * 0.70);
    var sx = Math.round((w - side) / 2), sy = Math.round((h - side) / 2);
    cv.width = 480; cv.height = 480;
    cx.drawImage(video, sx, sy, side, side, 0, 0, 480, 480);
    var center = cx.getImageData(0, 0, 480, 480);
    return { full: full, center: center };
  }

  /* Elfogadjuk-e ezt a talalatot? */
  function accept(text) {
    var now = Date.now();
    if (paused) return false;
    if (now < cooldownUntil) return false;
    if (SAME_IGNORE_MS > 0 && text === lastHitText &&
        now - lastHitTime < SAME_IGNORE_MS) return false;
    return true;
  }

  function show(text, how) {
    paused = true;
    lastHitText = text;
    lastHitTime = Date.now();
    /* WCAG 4.1.3: a talalatot bemondjuk. POLITE: megvarja, amig a
       kepernyoolvaso befejezi az eppen folyo mondatot. */
    announce.textContent = 'Kód beolvasva: ' + text;
    lastText = text;
    out.value = text;
    meta.textContent = how + '  ·  ' + text.length + ' karakter';
    panel.classList.add('show');
    frame.classList.add('hit');
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    beepStart();
    if (!actx) {
      /* Nem sikerult feloldani a hangot: iOS-en ehhez egy koppintas kell.
         Ezt kiirjuk, hogy a felhasznalo ne higgye hibanak. */
      meta.textContent += '  ·  a hangjelzéshez koppints egyszer a képernyőre';
    }
    /* WCAG 2.4.3 (Focus Order): a fokusz kerüljon a panelre, hogy a
       billentyuzetes es kepernyoolvasos hasznalo azonnal ott legyen. */
    try { goBtn.focus(); } catch (e) {}
  }

  goBtn.addEventListener('click', function () {
    beepStop();
    panel.classList.remove('show');
    frame.classList.remove('hit');
    /* Roviden, mert ez gyakran ismetlodik */
    announce.textContent = 'Keresés folytatódik.';
    lastText = null;
    cooldownUntil = Date.now() + COOLDOWN_MS;
    paused = false;
  });

  /* "Felismerés megszakítása, bezárás" -- a KAMERA IS kikapcsol.
     Ez fontos: a keszulek kamerajelzo fenye addig eg, amig a folyam el,
     ezert nem eleg csak a keresest szuneteltetni. */
  function stopAll() {
    beepStop();
    paused = true; running = false;
    panel.classList.remove('show');
    frame.classList.remove('hit');
    if (camStream) {
      try { camStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      camStream = null;
    }
    try { video.srcObject = null; } catch (e) {}
    stoppedBox.classList.add('show');
    status.textContent = 'Leállítva';
    announce.textContent = 'A felismerés leállítva, a kamera kikapcsolva.';
    try { restartBtn.focus(); } catch (e) {}
  }
  stopBtn.addEventListener('click', stopAll);

  /* Kimelo mod: ritkabb vizsgalat. Ha a felhasznalo kepernyoolvasoval
     dolgozik, ez adja vissza a keszulek valaszkeszseget. */
  var gentleBtn = document.getElementById('gentle');
  gentleBtn.addEventListener('click', function () {
    gentle = !gentle;
    gentleBtn.setAttribute('aria-pressed', gentle ? 'true' : 'false');
    announce.textContent = gentle
      ? 'Kímélő mód bekapcsolva. A felismerés lassabb, de a felolvasás zavartalan.'
      : 'Kímélő mód kikapcsolva. A felismerés gyorsabb.';
  });

  restartBtn.addEventListener('click', function () {
    stoppedBox.classList.remove('show');
    announce.textContent = 'A felismerés újraindul.';
    startCamera();
  });

  document.getElementById('copy').addEventListener('click', function () {
    if (!lastText) return;
    if (navigator.clipboard) navigator.clipboard.writeText(lastText);
    else { out.removeAttribute('readonly'); out.select();
           document.execCommand('copy'); out.setAttribute('readonly',''); }
    /* WCAG 4.1.3: a masolas sikere kulonben csak vizualisan latszana */
    announce.textContent = 'A szöveg a vágólapra másolva.';
  });

  /* WCAG 2.1.1 (Keyboard): Esc is bezarja a panelt es leallitja a hangot */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (panel.classList.contains('show')) { goBtn.click(); }
  });

  function loop() {
    if (!paused) {
      var g = grab();
      if (g) {
        scans++;
        var r = null;
        // A) zxing-wasm -- aszinkron, sajat utemben fut
        wasmDecode(g.center);
        // B) natív, ha van (iPhone-on soha)
        if (native) {
          native.detect(video).then(function (list) {
            if (list && list.length && accept(list[0].rawValue)) {
              hits++; show(list[0].rawValue, 'natív BarcodeDetector'); }
          }).catch(function () {});
        }
        // B/C) ZXing es jsQR
        r = tryDecode(g.full, g.center);
        if (r && accept(r.text)) { hits++; show(r.text, r.how); }
      }
      /* valodi sebesseg: hany teljes keresest vegzunk masodpercenkent */
      fpsN++;
      var nowT = performance.now();
      if (!fpsT0) fpsT0 = nowT;
      if (nowT - fpsT0 >= 1000) {
        fps = Math.round(fpsN * 1000 / (nowT - fpsT0));
        fpsT0 = nowT; fpsN = 0;
        status.textContent = 'Keresés…  ' + fps + ' vizsgálat/mp';
      }
    }
    /* setTimeout es NEM requestAnimationFrame: igy a bongeszo (es vele a
       kepernyoolvaso) tenylegesen szohoz jut ket vizsgalat kozott. */
    if (running) setTimeout(loop, gentle ? SCAN_GAP_A11Y_MS : SCAN_GAP_MS);
  }

  function fail(msg) {
    errMsg.textContent = msg;
    errBox.classList.add('show');
    announce.textContent = 'Hiba: nincs kamerakép. ' + msg;
  }

  function startCamera() {
    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },   // hatso kamera
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      }
    }).then(function (stream) {
      camStream = stream;               // eltesszuk, hogy le tudjuk allitani
      video.srcObject = stream;
      return video.play();
    }).then(function () {
      var eng = [];
      if (window.__zxingWasm) eng.push('zxing-wasm');
      if (native) eng.push('natív');
      if (zxing)  eng.push('ZXing-js');
      if (window.jsQR) eng.push('jsQR');
      engineEl.textContent = eng.join(' + ');
      /* A hangkimenet feloldasa: egyes bongeszokben a kamera-engedely
         megadasa is felhasznaloi gesztusnak szamit, ezert itt is
         megprobaljuk. Ha nem sikerul, az elso kepernyo-koppintas oldja
         fel (lasd a lenti esemenyfigyelot). */
      audioUnlock();
      status.textContent = cx ? 'Keresés…' : 'Hiba: a rajzvászon nem érhető el';
      if (!cx) announce.textContent = 'Hiba: a böngésző nem adott rajzvásznat, a felismerés nem működik.';
      paused = false;
      cooldownUntil = Date.now() + COOLDOWN_MS;
      /* a ciklust csak egyszer inditjuk el; ujrainditasnal nem duplazzuk */
      if (!running) { running = true; setTimeout(loop, SCAN_GAP_MS); }
    }).catch(function (e) {
      fail(e && e.message ? e.message : String(e));
    });
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    fail('A böngésző nem támogatja a kamerát, vagy a lap nem HTTPS címen fut.');
  } else {
    startCamera();
  }
})();
</script>
</body>
</html>
